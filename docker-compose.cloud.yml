services:
  app:
    build:
      context: .
      target: runner
      args:
        # These build args are needed for SSG pages during `next build`
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_S3_PUBLIC_URL=${NEXT_PUBLIC_S3_PUBLIC_URL}
        - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
        # 构建期 validateServerEnv 需要的占位值（真实密钥运行时经 env_file 注入）
        - S3_ENDPOINT=${S3_ENDPOINT:-http://placeholder.invalid}
        - S3_BUCKET_NAME=${S3_BUCKET_NAME:-placeholder}
        - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-placeholder}
        - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-placeholder}
        - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-placeholder_secret_at_least_32_chars}
        - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database (Defaults to Cloud/Neon if not set to 'local')
      - DATABASE_PROVIDER=neon

      # Environment variables should be passed via a .env file or the host environment
      # Required vars:
      # - DATABASE_URL
      # - BETTER_AUTH_SECRET
      # - BETTER_AUTH_URL
      # - NEXT_PUBLIC_APP_URL
      # - S3_ACCESS_KEY_ID
      # - S3_SECRET_ACCESS_KEY
      # - S3_BUCKET_NAME
      # - S3_REGION (Optional)
      # - S3_ENDPOINT (Optional, for Cloudflare R2 etc.)
      # - S3_PUBLIC_URL
      # - NEXT_PUBLIC_S3_PUBLIC_URL
    env_file:
      - .env
