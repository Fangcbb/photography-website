# Standalone Full-Stack Configuration (PostgreSQL + RustFS + App)
# Run with: docker compose -f docker-compose.standalone.yml up
# Override defaults by creating a .env file (see .env.example)
#
# Security hardening:
# - Infrastructure ports bind to 127.0.0.1 only (not exposed to all interfaces).
# - Secret env vars have no fallback: deployment fails fast if they are missing.
# - Bucket anonymous policy is read-only ("download"), not read-write ("public").
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-photography}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data

  create-bucket:
    image: minio/mc
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://rustfs:9000 $$RUSTFS_ACCESS_KEY $$RUSTFS_SECRET_KEY; do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/photography --ignore-existing;
      /usr/bin/mc anonymous set download myminio/photography;
      exit 0;
      "

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-photography}
    command: npm run db:push
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/db:/app/src/db
      - ./drizzle.config.ts:/app/drizzle.config.ts

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - next_cache:/app/.next
    command: >
      /bin/sh -c "
        echo 'Waiting for database...' &&
        npm run db:push &&
        echo 'Building application...' &&
        npm run build &&
        echo 'Copying static assets...' &&
        cp -r .next/static .next/standalone/.next/static &&
        cp -r public .next/standalone/public &&
        echo 'Starting server...' &&
        node .next/standalone/server.js
      "
    environment:
      DATABASE_PROVIDER: local
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-photography}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET_NAME: ${POSTGRES_DB:-photography}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      S3_PUBLIC_URL: http://localhost:9000/${POSTGRES_DB:-photography}
      NEXT_PUBLIC_S3_PUBLIC_URL: http://localhost:9000/${POSTGRES_DB:-photography}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rustfs_data:
  next_cache:
